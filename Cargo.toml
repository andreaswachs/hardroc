[package]
name = "hardroc"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A full-featured language server for the Roc programming language"
license = "MIT"
repository = "https://github.com/andreaswachs/hardroc"
default-run = "hardroc"

[[bin]]
name = "hardroc"
path = "src/main.rs"

[lib]
name = "hardroc"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
lsp-types = "0.94.1"
once_cell = "1.19"
regex = "1.10"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "io-util", "sync"] }
tower-lsp = "0.20"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
strip = true
